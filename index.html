/* Layout: duas divisões verticais. Menu verde-escuro à esquerda com os 8 botões, área de trabalho clara à direita. O tomate é a única cor forte. */
:root{
  --bg:#E9ECE6; --panel:#FFFFFF; --tint:#F3F5F1; --fg:#18221E; --muted:#5A675F; --line:#D7DCD3;
  --side:#14302A; --side-fg:#E6EFE9; --side-mut:#93AB9F;
  --accent:#CF3B25; --accent-fg:#FFFFFF; --accent-soft:#FBE4DE;
  --ok:#23724A; --warn:#946100; --bad:#B3261E;
  --crust:#E3B15C; --cheese:#F3D67C;
  --f-display:'Bricolage Grotesque','DM Sans',system-ui,sans-serif;
  --f-body:'DM Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0C1311; --panel:#16201C; --tint:#1C2823; --fg:#E7EFEA; --muted:#9CAAA2; --line:#2B3A34;
    --side:#0A1A16; --side-fg:#E6EFE9; --side-mut:#7F988C;
    --accent:#EC5A41; --accent-fg:#1A0A06; --accent-soft:#3B1F19;
    --ok:#5FC48B; --warn:#E2B04A; --bad:#F0786F;
    --crust:#C48F3F; --cheese:#D9B95F; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0C1311; --panel:#16201C; --tint:#1C2823; --fg:#E7EFEA; --muted:#9CAAA2; --line:#2B3A34;
  --side:#0A1A16; --side-fg:#E6EFE9; --side-mut:#7F988C;
  --accent:#EC5A41; --accent-fg:#1A0A06; --accent-soft:#3B1F19;
  --ok:#5FC48B; --warn:#E2B04A; --bad:#F0786F;
  --crust:#C48F3F; --cheese:#D9B95F; color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:28px;line-height:1.1}
h2{font-size:18px}
h3{font-size:15px}
p{margin:0}
.app{max-width:1180px;margin:0 auto;min-height:calc(100dvh - 32px);display:grid;grid-template-columns:268px minmax(0,1fr);
  background:var(--panel);border:1px solid var(--line);border-radius:18px;overflow:hidden}
.side{background:var(--side);color:var(--side-fg);padding:22px 14px;display:flex;flex-direction:column;gap:18px;min-width:0}
.brand{display:flex;align-items:center;gap:10px;padding:0 6px}
.brand b{font-family:var(--f-display);font-size:24px;letter-spacing:-.02em}
.brand b span{color:var(--accent)}
.who{background:rgba(255,255,255,.07);border-radius:12px;padding:10px 12px;font-size:13px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.who small{display:block;color:var(--side-mut)}
.who button{background:none;border:0;color:var(--side-fg);text-decoration:underline;cursor:pointer;padding:4px;font-size:13px}
.nav{display:flex;flex-direction:column;gap:3px}
.nav button{display:flex;align-items:center;gap:12px;width:100%;padding:11px 12px;border:0;border-radius:10px;background:transparent;color:var(--side-fg);font-weight:500;cursor:pointer;text-align:left}
.nav button:hover{background:rgba(255,255,255,.08)}
.nav button[aria-current="page"]{background:var(--accent);color:var(--accent-fg)}
.nav svg{flex:none}
.badge{margin-left:auto;background:var(--side-fg);color:var(--side);border-radius:99px;font-size:12px;font-weight:700;padding:0 8px;line-height:20px}
.nav button[aria-current="page"] .badge{background:var(--accent-fg);color:var(--accent)}
.side-foot{margin-top:auto;display:flex;flex-direction:column;gap:10px}
.cart-chip{font-size:13px;color:var(--side-mut);padding:0 6px}
.cart-chip b{color:var(--side-fg)}
.admin-link{border:1px solid rgba(255,255,255,.22);background:transparent;color:var(--side-fg);border-radius:10px;padding:9px 12px;cursor:pointer;display:flex;gap:10px;align-items:center}
.admin-link:hover{background:rgba(255,255,255,.08)}
.admin-link[aria-current="page"]{background:var(--side-fg);color:var(--side)}
.main{padding:28px;min-width:0;display:flex;flex-direction:column;gap:20px}
.head p{color:var(--muted);margin-top:6px;max-width:62ch}
.box{background:var(--tint);border:1px solid var(--line);border-radius:14px;padding:18px;min-width:0}
.box>h2{margin-bottom:12px}
.stack{display:flex;flex-direction:column;gap:16px;min-width:0}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.grow{flex:1;min-width:0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--accent);background:var(--accent);color:var(--accent-fg);padding:10px 18px;border-radius:10px;font-weight:700;cursor:pointer}
.btn:hover{filter:brightness(1.06)}
.btn.ghost{background:transparent;color:var(--fg);border-color:var(--line)}
.btn.ghost:hover{border-color:var(--muted)}
.btn.sm{padding:6px 12px;font-size:13px}
.btn[disabled]{opacity:.45;cursor:not-allowed;filter:none}
.icon-btn{border:0;background:transparent;color:var(--muted);cursor:pointer;padding:8px;border-radius:8px;display:inline-flex}
.icon-btn:hover{color:var(--bad);background:var(--accent-soft)}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.nav button:focus-visible,.admin-link:focus-visible,.who button:focus-visible{outline-color:var(--side-fg)}
.size-grid,.type-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.size,.type{display:flex;flex-direction:column;align-items:center;gap:4px;padding:14px 8px;background:var(--panel);border:2px solid var(--line);border-radius:14px;cursor:pointer;text-align:center}
.size:hover,.type:hover{border-color:var(--muted)}
.size[aria-pressed="true"],.type[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.size b,.type b{font-family:var(--f-display);font-size:17px}
.size span,.type span{font-size:13px}
.size small,.type small{color:var(--muted);font-size:12px}
.build{display:grid;grid-template-columns:minmax(0,1fr) 280px;gap:16px;align-items:start}
.flavors{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
.flavor{display:flex;gap:10px;align-items:flex-start;text-align:left;padding:12px;background:var(--panel);border:2px solid var(--line);border-radius:12px;cursor:pointer}
.flavor:hover{border-color:var(--muted)}
.flavor[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.flavor i{flex:none;width:14px;height:14px;border-radius:50%;margin-top:4px;border:1px solid rgba(0,0,0,.2)}
.flavor b{display:block}
.flavor small{display:block;color:var(--muted);font-size:12.5px;line-height:1.35}
.flavor em{font-style:normal;font-weight:700;font-size:13px;display:block;margin-top:4px}
.preview{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;position:sticky;top:16px}
.preview ul{list-style:none;margin:0;padding:0;font-size:14px}
.calc{font-size:13px;color:var(--muted)}
.price{font-family:var(--f-display);font-size:26px;font-weight:700}
.note{font-size:13px;color:var(--muted)}
.note.warn{color:var(--warn)}
.empty{padding:34px 16px;text-align:center;color:var(--muted);background:var(--panel);border:1px dashed var(--line);border-radius:14px;display:flex;flex-direction:column;gap:12px;align-items:center}
.items{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.items li{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.items li:last-child{border-bottom:0}
.items li>div{flex:1;min-width:0}
.items span{display:block;color:var(--muted);font-size:13px}
.num{font-variant-numeric:tabular-nums;white-space:nowrap}
.total{display:flex;justify-content:space-between;align-items:baseline;font-family:var(--f-display);font-size:22px;font-weight:700;padding-top:12px;border-top:2px solid var(--fg)}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field label{font-size:13px;font-weight:700}
.field input,.field select,.field textarea{padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--panel);width:100%;min-width:0}
.field textarea{min-height:96px;resize:vertical}
.form-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.err{color:var(--bad);font-size:14px;font-weight:500}
.drink{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.drink:last-child{border-bottom:0}
.stepper{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:10px;background:var(--panel)}
.stepper button{border:0;background:none;cursor:pointer;padding:6px 10px;border-radius:8px}
.stepper button:hover{background:var(--tint)}
.stepper output{min-width:28px;text-align:center;font-variant-numeric:tabular-nums;font-weight:700}
.rank{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:12px}
.rank li{display:grid;grid-template-columns:34px minmax(0,1fr) auto;gap:12px;align-items:center}
.rank .pos{font-family:var(--f-display);font-size:24px;font-weight:700;color:var(--accent)}
.bar{height:8px;border-radius:99px;background:var(--line);margin-top:6px}
.bar>i{display:block;height:100%;border-radius:99px;background:var(--accent)}
.card-order{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:8px}
.card-order header{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.pill{display:inline-block;padding:2px 10px;border-radius:99px;font-size:12px;font-weight:700;background:color-mix(in srgb,currentColor 14%,transparent)}
.pill.ok{color:var(--ok)}.pill.warn{color:var(--warn)}.pill.bad{color:var(--bad)}.pill.mute{color:var(--muted)}
.stars{display:inline-flex;gap:2px}
.stars button{border:0;background:none;font-size:28px;line-height:1;color:var(--line);cursor:pointer;padding:2px 3px}
.stars button[aria-pressed="true"]{color:#E0A526}
.pick{display:flex;flex-direction:column;gap:8px}
.pick button{text-align:left;background:var(--panel);border:2px solid var(--line);border-radius:12px;padding:12px;cursor:pointer;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
.pick button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.pick button[disabled]{opacity:.5;cursor:not-allowed}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tabs button{border:1px solid var(--line);background:var(--panel);padding:8px 14px;border-radius:99px;cursor:pointer;font-weight:500}
.tabs button[aria-pressed="true"]{background:var(--fg);color:var(--panel);border-color:var(--fg)}
.scroll{overflow-x:auto;max-width:100%}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:8px 10px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
td.r,th.r{text-align:right;font-variant-numeric:tabular-nums}
td.heat{text-align:center;font-variant-numeric:tabular-nums;min-width:48px}
.split{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--panel);padding:10px 18px;border-radius:99px;font-weight:500;z-index:50;max-width:calc(100vw - 32px);text-align:center}
.toast[hidden]{display:none}
.checks{display:flex;flex-direction:column;gap:6px;font-size:14px}
.checks label{display:flex;gap:8px;align-items:center}
.ok-big{display:flex;gap:14px;align-items:center}
.ok-big svg{color:var(--ok);flex:none}
@media (max-width:860px){
  .app{grid-template-columns:minmax(0,1fr)}
  .side{padding:14px 12px;gap:12px}
  .nav{flex-direction:row;overflow-x:auto;padding-bottom:4px}
  .nav button{width:auto;white-space:nowrap;flex:none}
  .side-foot{margin-top:0;flex-direction:row;align-items:center;justify-content:space-between;flex-wrap:wrap}
  .main{padding:18px 14px}
  .build{grid-template-columns:minmax(0,1fr)}
  .preview{position:static}
}
@media (prefers-reduced-motion:no-preference){.btn,.size,.flavor,.nav button{transition:background .15s,border-color .15s,filter .15s}}
</style>

function $(s,el){return (el||document).querySelector(s)}
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function fmt(v){return v.toLocaleString('pt-BR',{style:'currency',currency:'BRL'})}
function fdt(iso){var d=new Date(iso);return d.toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit'})+' '+d.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'})}
function fhm(d){return d.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'})}
function fqty(v,un){
  if(un==='g'){return v>=1000?(v/1000).toLocaleString('pt-BR',{maximumFractionDigits:1})+' kg':Math.round(v)+' g'}
  return Math.round(v)+' un';
}
function FL(id){return FLAVORS.find(function(f){return f.id===id})}
function DR(id){return DRINKS.find(function(d){return d.id===id})}
function SZ(id){return SIZES.find(function(s){return s.id===id})}
function EM(id){return EMP.find(function(e){return e.id===id})||{nome:'—'}}
function uid(){return 'i'+Math.random().toString(36).slice(2,9)}
function plural(n,a,b){return n===1?a:b}

function rng(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;var t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function pickW(r,arr,wf){var tot=0,w=arr.map(function(a){var x=wf(a);tot+=x;return x}),v=r()*tot;for(var i=0;i<arr.length;i++){v-=w[i];if(v<=0)return arr[i]}return arr[arr.length-1]}

/* ---------- Regras de negócio ---------- */
function pizzaPrice(slices,flavs){var m=0;flavs.forEach(function(f){m=Math.max(m,FL(f).preco)});return Math.round(m*slices*100)/100}
function itemTotal(it){return it.tipo==='pizza'?it.preco:it.preco*it.qtd}
function sumTotal(items){return items.reduce(function(a,i){return a+itemTotal(i)},0)}
function prepOf(items){var m=0;items.forEach(function(it){if(it.tipo==='pizza')it.flavors.forEach(function(f){m=Math.max(m,FL(f).prep)})});return m||5}
function consumption(items){
  var c={};
  items.forEach(function(it){
    if(it.tipo==='pizza'){
      var share=it.slices/it.flavors.length;
      it.flavors.forEach(function(f){var rec=FL(f).rec;Object.keys(rec).forEach(function(k){c[k]=(c[k]||0)+rec[k]*share})});
    }else{c[it.id]=(c[it.id]||0)+it.qtd}
  });
  return c;
}
function validCount(n,max){return (n===1||n===2||n===4)&&n<=max}

/* ---------- Dados de exemplo e persistência ---------- */
function seed(){
  var r=rng(20261119),now=new Date(),orders=[],opinions=[],oid=1000,cfg={deliveryMin:35};
  var DOW_BASE=[12,5,5,6,7,13,14];
  for(var d=60;d>=1;d--){
    var day=new Date(now);day.setDate(now.getDate()-d);var dow=day.getDay();
    var n=DOW_BASE[dow]+Math.floor(r()*4)-1;
    for(var k=0;k<n;k++){
      var hour=r()<0.2?11+Math.floor(r()*3):18+Math.floor(r()*4);
      var t=new Date(day);t.setHours(hour,Math.floor(r()*60),0,0);
      var cli=pickW(r,CLIENTS0,function(c){return c.w});
      var items=[],np=r()<0.55?1:(r()<0.78?2:3);
      for(var p=0;p<np;p++){
        var sz=pickW(r,SIZES,function(s){return s.id==='p'?25:s.id==='m'?40:35});
        var opts=[1,2,4].filter(function(x){return x<=sz.max});
        var nf=pickW(r,opts,function(x){return x===1?60:x===2?30:10});
        var fl=[],guard=0;
        while(fl.length<nf&&guard++<50){
          var f=pickW(r,FLAVORS,function(f){
            var w={mussarela:8,marguerita:9,calabresa:14,portuguesa:10,frango:12,quatro:7,napolitana:4,bacon:8,atum:3,chocolate:5,morango:4}[f.id];
            if((dow===5||dow===6)&&(f.id==='chocolate'||f.id==='morango'))w*=1.6;
            if((dow===5||dow===6)&&f.id==='quatro')w*=1.3;
            if(dow===0&&f.id==='calabresa')w*=1.4;
            if(dow===0&&f.id==='portuguesa')w*=1.3;
            if(dow===3&&f.id==='marguerita')w*=1.3;
            if(d<=30&&f.id==='frango')w*=1.25;
            return w;
          });
          if(fl.indexOf(f.id)<0)fl.push(f.id);
        }
        items.push({uid:uid(),tipo:'pizza',size:sz.id,slices:sz.slices,flavors:fl,preco:pizzaPrice(sz.slices,fl)});
      }
      if(r()<0.7){
        var nd=r()<0.7?1:2;
        for(var q=0;q<nd;q++){
          var dr=pickW(r,DRINKS,function(x){return {d_cola:12,d_guarana:9,d_limao:3,d_laranja:5,d_uva:3,d_maracuja:3,d_pilsen:(dow>=5||dow===0)?10:6,d_ipa:3,d_weiss:2}[x.id]});
          var ex=items.find(function(i){return i.tipo==='bebida'&&i.id===dr.id});
          if(ex)ex.qtd+=1;else items.push({uid:uid(),tipo:'bebida',id:dr.id,qtd:1+(r()<0.25?1:0),preco:dr.preco});
        }
      }
      var prep=prepOf(items),del=cfg.deliveryMin+Math.floor(r()*10)-5;
      var eta=new Date(t.getTime()+(prep+del)*60000);
      var maker=EMP[Math.floor(r()*EMP.length)];
      var dlv=r()<0.5?maker:EMP[Math.floor(r()*EMP.length)];
      var o={id:++oid,clientId:cli.id,createdAt:t.toISOString(),etaAt:eta.toISOString(),items:items,total:sumTotal(items),
        address:cli.end,bairro:cli.bairro,makerId:maker.id,delivererId:dlv.id,entregue:true,
        deliveredAt:new Date(eta.getTime()+Math.floor((r()-0.3)*15)*60000).toISOString(),prepMin:prep,deliveryMin:del};
      orders.push(o);
      if(r()<0.1){
        var bp=maker.id==='e3'?2.9:4.5,be=dlv.id==='e5'?2.7:4.5;
        var np2=Math.max(1,Math.min(5,Math.round(bp+(r()-0.5)*2.4))),ne=Math.max(1,Math.min(5,Math.round(be+(r()-0.5)*2.4)));
        var txt=[];
        if(np2<=2)txt.push(['A pizza chegou fria e com pouco recheio.','A massa estava crua no meio.'][Math.floor(r()*2)]);
        else if(np2>=4)txt.push(['Pizza excelente, bem recheada.','Massa no ponto certo, voltarei a pedir.'][Math.floor(r()*2)]);
        if(ne<=2)txt.push(['A entrega demorou bem mais que o previsto.','O entregador se perdeu e a pizza esfriou.'][Math.floor(r()*2)]);
        else if(ne>=4)txt.push('Entrega rápida.');
        if(r()<0.2)txt.push('Sugestão: incluir borda recheada no cardápio.');
        opinions.push({id:'op'+o.id,orderId:o.id,clientId:cli.id,pizza:np2,entrega:ne,texto:txt.join(' '),makerId:maker.id,delivererId:dlv.id,em:new Date(eta.getTime()+3600000).toISOString()});
      }
    }
  }
  return {v:1,clients:CLIENTS0.map(function(c){var x=Object.assign({},c);delete x.w;return x}),orders:orders,opinions:opinions,
    stock:STOCK0.map(function(s){return {id:s[0],nome:s[1],un:s[2],qtd:s[3],min:s[4],forn:s[5]}}),
    purchases:[],cfg:cfg,nextMaker:0,session:{user:null,cart:[]}};
}
function load(){
  try{var s=localStorage.getItem(KEY);if(s){var d=JSON.parse(s);if(d&&d.v===1)return d}}catch(e){}
  return seed();
}

function ic(n,px){px=px||20;return '<svg viewBox="0 0 24 24" width="'+px+'" height="'+px+'" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+ICONS[n]+'</svg>'}
function pizzaSVG(n,colors,px){
  var c=50,r=44,s='<svg viewBox="0 0 100 100" width="'+px+'" height="'+px+'" aria-hidden="true"><circle cx="50" cy="50" r="48" style="fill:var(--crust)"/>';
  for(var i=0;i<n;i++){
    var a0=(-90+i*360/n)*Math.PI/180,a1=(-90+(i+1)*360/n)*Math.PI/180;
    var x0=c+r*Math.cos(a0),y0=c+r*Math.sin(a0),x1=c+r*Math.cos(a1),y1=c+r*Math.sin(a1);
    var col=colors.length?colors[Math.min(colors.length-1,Math.floor(i*colors.length/n))]:null;
    s+='<path d="M50 50L'+x0.toFixed(2)+' '+y0.toFixed(2)+'A'+r+' '+r+' 0 0 1 '+x1.toFixed(2)+' '+y1.toFixed(2)+'Z" style="fill:'+(col||'var(--cheese)')+';stroke:var(--panel);stroke-width:1.6;stroke-linejoin:round"/>';
  }
  return s+'</svg>';
}
function logoMark(){return '<svg viewBox="0 0 100 100" width="34" height="34" aria-hidden="true"><circle cx="50" cy="50" r="46" fill="#E3B15C"/><path d="M50 50L50 8A42 42 0 0 1 88 68Z" fill="#CF3B25"/><path d="M50 50L88 68A42 42 0 0 1 50 92Z" fill="#F3D67C"/><circle cx="62" cy="30" r="5" fill="#8A2415"/><circle cx="72" cy="56" r="4" fill="#8A2415"/></svg>'}

/* ---------- Área da empresa ---------- */
function usage30(){
  var since=Date.now()-30*864e5,tot={};
  DB.orders.forEach(function(o){if(new Date(o.createdAt).getTime()>=since){var c=consumption(o.items);Object.keys(c).forEach(function(k){tot[k]=(tot[k]||0)+c[k]})}});
  return tot;
}
function openQty(id){
  var q=0;DB.purchases.forEach(function(p){if(p.status==='enviado')p.itens.forEach(function(i){if(i.id===id)q+=i.qtd})});return q;
}
function proposals(){
  var u=usage30(),out={};
  DB.stock.forEach(function(s){
    var eff=s.qtd+openQty(s.id);
    if(eff<=s.min*1.25){
      var step=s.un==='g'?100:1,avg=(u[s.id]||0)/30;
      var sug=Math.ceil(Math.max(s.min*1.25+avg*7-eff,step)/step)*step;
      (out[s.forn]=out[s.forn]||[]).push({id:s.id,nome:s.nome,un:s.un,qtd:s.qtd,min:s.min,sug:sug});
    }
  });
  return out;
}

    order.map(function(f){return '<tr><td>'+f.nome+'</td>'+mons.map(function(m){return heat(byMon[f.id][m.k]||0,mx2)}).join('')+'</tr>'}).join('')+'</tbody></table></div></div></div>';
  var cl={},br={};

  });
  var topC=Object.keys(cl).map(function(id){return {id:id,n:cl[id].n,v:cl[id].v}}).sort(function(a,b){return b.v-a.v}).slice(0,8);
  var topB=Object.keys(br).map(function(k){return {k:k,n:br[k].n,v:br[k].v,c:Object.keys(br[k].cs).length}}).sort(function(a,b){return b.v-a.v});
  h+='<div class="split"><div class="box stack"><h2>Clientes que mais consomem</h2><div class="scroll"><table><thead><tr><th>Cliente</th><th>Bairro</th><th class="r">Pedidos</th><th class="r">Total</th></tr></thead><tbody>'+
    topC.map(function(c){var x=DB.clients.find(function(y){return y.id===c.id});return '<tr><td>'+esc(x?x.nome:'—')+'</td><td>'+esc(x?x.bairro:'—')+'</td><td class="r">'+c.n+'</td><td class="r">'+fmt(c.v)+'</td></tr>'}).join('')+'</tbody></table></div></div>';
  var mb=topB.length?topB[0].v:1;
  h+='<div class="box stack"><h2>Consumo por bairro</h2>'+topB.map(function(b){return '<div><div class="row"><b class="grow">'+esc(b.k)+'</b><span class="num">'+fmt(b.v)+'</span></div><div class="note">'+b.c+' '+plural(b.c,'cliente','clientes')+' · '+b.n+' pedidos</div><div class="bar"><i style="width:'+Math.round(b.v/mb*100)+'%"></i></div></div>'}).join('')+'</div></div>';
  var u=usage30();
  h+='<div class="box stack"><h2>Consumo médio diário por produto</h2><p class="note">Base dos últimos 30 dias. Use como referência para as quantidades a pedir.</p><div class="scroll"><table><thead><tr><th>Produto</th><th class="r">Consumo em 30 dias</th><th class="r">Média por dia</th><th class="r">Em estoque</th><th class="r">Cobertura</th></tr></thead><tbody>'+
    DB.stock.map(function(s){var a=(u[s.id]||0)/30;return '<tr><td>'+esc(s.nome)+'</td><td class="r">'+fqty(u[s.id]||0,s.un)+'</td><td class="r">'+fqty(a,s.un)+'</td><td class="r">'+fqty(s.qtd,s.un)+'</td><td class="r">'+(a>0?(s.qtd/a).toLocaleString('pt-BR',{maximumFractionDigits:1})+' dias':'—')+'</td></tr>'}).join('')+'</tbody></table></div></div>';
  return h;
}
function adminHtml(){
  var T=[['estoque','Estoque'],['compras','Compras'],['entregas','Entregas'],['opinioes','Opiniões'],['relatorios','Relatórios']];
  var h=head('Área da empresa','Estoque, compras, entregas, opiniões e relatórios. Os dados de clientes e pedidos antigos são exemplos para demonstração.');
  h+='<div class="tabs" role="group" aria-label="Seções">'+T.map(function(t){return '<button data-act="tab" data-id="'+t[0]+'" aria-pressed="'+(ui.tab===t[0])+'">'+t[1]+'</button>'}).join('')+'</div>';
  h+={estoque:tabEstoque,compras:tabCompras,entregas:tabEntregas,opinioes:tabOpinioes,relatorios:tabRelatorios}[ui.tab]();
  h+='<div class="row">'+(ui.confirmReset?'<span class="note">Isso apaga clientes, pedidos e estoque atuais.</span><button class="btn sm" data-act="reset">Confirmar restauração</button><button class="btn ghost sm" data-act="cancelReset">Cancelar</button>':'<button class="btn ghost sm" data-act="confirmReset">Restaurar dados de exemplo</button>')+'</div>';
  return h;
}

/* ---------- Renderização ---------- */
function render(){
  $('#side').innerHTML=sideHtml();
  $('#main').innerHTML=ui.admin?adminHtml():MODS[ui.module]();
  save();
}

/* ---------- Ações ---------- */
var A={
  nav:function(d){go(d.m)},
  admin:function(){ui.admin=true;ui.confirmReset=false;render();try{window.scrollTo(0,0)}catch(e){}},
  tab:function(d){ui.tab=d.id;ui.recv=null;render()},
  logout:function(){DB.session.user=null;ui.editData=false;ui.fend=null;ui.fbairro=null;toast('Você saiu.');render()},
  goLogin:function(d){ui.returnTo=d.back;ui.authView='login';go('logar',true)},
  authView:function(d){ui.authView=d.v;ui.authErr='';render()},
  editData:function(){ui.editData=true;render()},
  cancelEdit:function(){ui.editData=false;render()},
  size:function(d){
    ui.size=d.id;var max=SZ(d.id).max;if(ui.flav.length>max)ui.flav=ui.flav.slice(0,max);render();
  },
  flav:function(d){
    var s=SZ(ui.size),i=ui.flav.indexOf(d.id);
    if(i>=0)ui.flav.splice(i,1);
    else if(s.max===1)ui.flav=[d.id];
    else if(ui.flav.length>=s.max){toast('A pizza '+s.nome.toLowerCase()+' aceita no máximo '+s.max+' sabores.');return}
    else ui.flav.push(d.id);
    render();
  },
  clearFlav:function(){ui.flav=[];render()},
  add:function(){
    var s=SZ(ui.size);if(!validCount(ui.flav.length,s.max))return;
    cart().push({uid:uid(),tipo:'pizza',size:s.id,slices:s.slices,flavors:ui.flav.slice(),preco:pizzaPrice(s.slices,ui.flav)});
    ui.flav=[];render();toast('Pizza adicionada ao pedido. Escolha outra, se quiser.');
  },
  dtype:function(d){ui.dtype=d.id;render()},
  dq:function(d){ui.dq[d.id]=Math.max(1,Math.min(20,(ui.dq[d.id]||1)+parseInt(d.d,10)));render()},
  addDrink:function(d){
    var q=ui.dq[d.id]||1,dr=DR(d.id),inCart=0;
    cart().forEach(function(i){if(i.tipo==='bebida'&&i.id===d.id)inCart+=i.qtd});
    if(q+inCart>stockOf(d.id).qtd){toast('Estoque insuficiente. Restam '+(stockOf(d.id).qtd-inCart)+' unidades.');return}
    var ex=cart().find(function(i){return i.tipo==='bebida'&&i.id===d.id});
    if(ex)ex.qtd+=q;else cart().push({uid:uid(),tipo:'bebida',id:d.id,qtd:q,preco:dr.preco});
    ui.dq[d.id]=1;render();toast(q+' × '+dr.nome+' no pedido.');
  },
  rm:function(d){DB.session.cart=cart().filter(function(i){return i.uid!==d.uid});render();toast('Item excluído.')},
  pedirSabor:function(d){ui.size=ui.size||'m';ui.flav=[d.id];go('pizzas')},
  reorder:function(d){
    var o=DB.orders.find(function(x){return x.id===parseInt(d.id,10)});
    o.items.forEach(function(it){var c=JSON.parse(JSON.stringify(it));c.uid=uid();cart().push(c)});
    go('pedido');toast('Itens copiados. Altere o que quiser antes de concluir.');
  },
  op:function(d){ui.op={orderId:parseInt(d.id,10),pizza:0,entrega:0};render()},
  star:function(d,b){
    ui.op[d.k]=parseInt(d.v,10);
    b.parentNode.querySelectorAll('button').forEach(function(x,i){x.setAttribute('aria-pressed',String(i<ui.op[d.k]))});
  },
  gerar:function(d){
    var pr=proposals(),forns=Object.keys(pr),f=forns[parseInt(d.fi,10)];if(!f)return;
    var n=DB.purchases.length+1;
    DB.purchases.push({id:'PC-'+(100+n),fornecedor:f,itens:pr[f].map(function(x){return {id:x.id,qtd:x.sug}}),em:new Date().toISOString(),status:'enviado'});
    render();toast('Pedido enviado para '+f+'.');
  },
  recv:function(d){ui.recv=d.id;render()},
  cancelRecv:function(){ui.recv=null;render()},
  confirmReset:function(){ui.confirmReset=true;render()},
  cancelReset:function(){ui.confirmReset=false;render()},
  reset:function(){
    try{localStorage.removeItem(KEY)}catch(e){}
    DB=seed();Object.assign(ui,{size:null,flav:[],confirmed:null,recv:null,confirmReset:false,fend:null,fbairro:null,op:{orderId:null,pizza:0,entrega:0}});
    render();toast('Dados de exemplo restaurados.');
  }
};
var F={
  login:function(fd){
    var l=String(fd.get('login')).trim().toLowerCase(),s=String(fd.get('senha'));
    var c=DB.clients.find(function(x){return x.login.toLowerCase()===l&&x.senha===s});
    if(!c){ui.authErr='Nome-login ou senha incorretos.';render();return}
    DB.session.user=c.id;ui.fend=null;ui.fbairro=null;
    var back=ui.returnTo||'pizzas';toast('Bem-vindo(a), '+c.nome.split(' ')[0]+'.');go(back);
  },
  register:function(fd){
    var l=String(fd.get('login')).trim().toLowerCase();
    if(DB.clients.some(function(x){return x.login.toLowerCase()===l})){ui.authErr='Esse nome-login já existe. Escolha outro.';render();return}
    var c={id:'c'+Date.now(),nome:String(fd.get('nome')).trim(),login:l,senha:String(fd.get('senha')),tel:String(fd.get('tel')).trim(),end:String(fd.get('end')).trim(),bairro:String(fd.get('bairro')).trim()};
    DB.clients.push(c);DB.session.user=c.id;ui.fend=null;ui.fbairro=null;ui.authView='login';
    var back=ui.returnTo||'pizzas';toast('Cadastro feito. Bem-vindo(a), '+c.nome.split(' ')[0]+'.');go(back);
  },
  dados:function(fd){
    var u=curUser();u.nome=String(fd.get('nome')).trim();u.tel=String(fd.get('tel')).trim();u.end=String(fd.get('end')).trim();u.bairro=String(fd.get('bairro')).trim();
    ui.editData=false;ui.fend=null;ui.fbairro=null;render();toast('Dados atualizados.');
  },
  fechar:function(fd){
    var u=curUser();if(!u){toast('Entre para concluir o pedido.');return}
    if(!cart().length){toast('O pedido está vazio.');return}
    var end=String(fd.get('endereco')).trim(),bairro=String(fd.get('bairro')).trim();
    if(!end||!bairro){toast('Informe endereço e bairro.');return}
    var cons=consumption(cart()),falta=Object.keys(cons).filter(function(k){return stockOf(k).qtd<cons[k]-1e-9}).map(function(k){return stockOf(k).nome});
    if(falta.length){toast('Estoque insuficiente de: '+falta.join(', ')+'.');return}
    var prep=prepOf(cart()),dm=DB.cfg.deliveryMin,now=new Date(),eta=new Date(now.getTime()+(prep+dm)*60000);
    var maxId=DB.orders.reduce(function(a,o){return Math.max(a,o.id)},1000);
    var maker=EMP[DB.nextMaker%EMP.length];DB.nextMaker++;
    var o={id:maxId+1,clientId:u.id,createdAt:now.toISOString(),etaAt:eta.toISOString(),items:JSON.parse(JSON.stringify(cart())),total:sumTotal(cart()),
      address:end,bairro:bairro,makerId:maker.id,delivererId:null,entregue:false,deliveredAt:null,prepMin:prep,deliveryMin:dm};
    Object.keys(cons).forEach(function(k){var s=stockOf(k);s.qtd=Math.round((s.qtd-cons[k])*10)/10});
    DB.orders.push(o);DB.session.cart=[];ui.confirmed=o.id;ui.fend=null;ui.fbairro=null;render();
    try{window.scrollTo(0,0)}catch(e){}
  },
  opinar:function(fd){
    var o=DB.orders.find(function(x){return x.id===ui.op.orderId});
    if(!o)return;
    if(!ui.op.pizza||!ui.op.entrega){toast('Dê uma nota de 1 a 5 para a pizza e para a entrega.');return}
    DB.opinions.push({id:'op'+o.id,orderId:o.id,clientId:o.clientId,pizza:ui.op.pizza,entrega:ui.op.entrega,texto:String(fd.get('texto')).trim(),makerId:o.makerId,delivererId:o.delivererId||o.makerId,em:new Date().toISOString()});
    ui.op={orderId:null,pizza:0,entrega:0};render();toast('Obrigado pela sua opinião.');
  },
  receber:function(fd,form){
    var p=DB.purchases.find(function(x){return x.id===form.dataset.pid}),div=false;
    p.itens.forEach(function(i){
      var q=parseFloat(fd.get('q_'+i.id));if(isNaN(q))q=0;
      if(q!==i.qtd)div=true;
      var s=stockOf(i.id);s.qtd=Math.round((s.qtd+q)*10)/10;i.recebido=q;
    });
    p.status='recebido';p.divergencia=div;p.recebidoEm=new Date().toISOString();ui.recv=null;render();toast(div?'Recebimento registrado com divergência.':'Recebimento conferido e estoque atualizado.');
  },
  entregar:function(fd,form){
    var o=DB.orders.find(function(x){return x.id===parseInt(form.dataset.oid,10)});
    var boxes=form.querySelectorAll('input[type=checkbox]'),all=true;boxes.forEach(function(b){if(!b.checked)all=false});
    if(!all){toast('Confira todos os itens antes de entregar.');return}
    o.entregue=true;o.deliveredAt=new Date().toISOString();o.delivererId=String(fd.get('entregador'));render();toast('Pedido #'+o.id+' entregue.');
  },
  cfg:function(fd){DB.cfg.deliveryMin=Math.max(5,parseInt(fd.get('min'),10)||35);render();toast('Tempo médio atualizado.')}
};

document.addEventListener('click',function(e){
  var b=e.target.closest('[data-act]');if(!b||b.disabled)return;
  var f=A[b.dataset.act];if(f)f(b.dataset,b);
});
document.addEventListener('submit',function(e){
  var f=e.target.closest('form[data-form]');if(!f)return;
  e.preventDefault();var h=F[f.dataset.form];if(h)h(new FormData(f),f);
});
document.addEventListener('input',function(e){
  var t=e.target;if(!t.closest||!t.closest('[data-form="fechar"]'))return;
  if(t.name==='endereco')ui.fend=t.value;
  if(t.name==='bairro')ui.fbairro=t.value;
});

render();
})();
</script>

</body></html>
